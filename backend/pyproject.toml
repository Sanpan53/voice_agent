[project]
name = "voice_agent"
version = "0.1.0"
description = "多 Agent 实时语音购物系统（Python 3.12 + FastAPI + AgentScope）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "dashscope>=1.20",
    # 澄清规则的品类必填槽位表（YAML 解析）。
    "pyyaml>=6.0",
    "PyJWT>=2.8",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    # AgentScope Python（多 Agent 方案，不用 LangGraph）。
    # 1.0.21 是已验证 API 映射的版本，保持 1.x 线。
    "agentscope>=1.0.21,<2.0",
    # agentscope 1.0.21 对 mcp 未加版本上界，mcp 2.x 会导致 import 失败，须锁 <2。
    "mcp>=1.13,<2.0",
    # agentscope 的 evaluate 模块用到 tqdm 但未声明，需显式补齐。
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = [
    # 需要真实外部依赖（PostgreSQL）的集成测试：依赖不可用时**自动跳过**，
    # 所以 python -m pytest -q 在没有数据库的机器上依然是全绿的。
    "integration: 需要真实 PostgreSQL 的集成测试",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["doc", ".venv", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
